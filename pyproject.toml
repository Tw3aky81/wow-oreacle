[project]
name = "wow-oreacle"
version = "0.0.1"
description = "Mine smarter. Craft wiser. Profit better."
readme = "README.md"
requires-python = ">=3.15"
dependencies = ["click>=8.5.0", "sqlalchemy>=2.1.6"]

[project.scripts]
wow-oreacle = "wow_oreacle.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wow_oreacle"]

[dependency-groups]
dev = ["pytest>=9.1.1"]
